<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<script>
    // HTML MADE BY CHATGPT
</script>

<head>
    <meta charset="UTF-8" />
    <title>Sales Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* —————— YOUR ENTIRE HEADER / CHECKOUT CSS —————— */
        :root {
          --purple: #6b4ca5;
          --blue-light: #8fd2f3;
          --border: #d4d8e0;
          --text-main: #1f2640;
          --text-muted: #6b7385;
          --bg-page: #f2f6fb;
          --card-bg: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          font-family: "Montserrat", system-ui, sans-serif;
          background: var(--bg-page);
          color: var(--text-main);
        }
        a { color: inherit; text-decoration: none; }

        .top-bar { background: #0d1b46; padding: 10px 0; }
        .top-bar-inner {
          max-width: 1200px;
          margin: 0 ;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 0;
        }
        .logo { font-weight: 600; font-size: 20px; }

        .checkout-header {
          background: var(--purple);
          color: #ffffff;
          padding: 18px 24px;
          display: flex;
          align-items: center;
          gap: 24px;
        }

        .checkout-home {
          font-size: 18px;
          font-weight: 500;
          text-decoration: none;
          color: #ffffff;
          opacity: 0.9;
          transition: 0.2s ease;
        }
        .checkout-home:hover {
          opacity: 1;
          text-decoration: underline;
        }

        .checkout-title {
          flex: 1;
          text-align: center;
          font-size: 32px;
          font-weight: 600;
          letter-spacing: 0.04em;
        }

        .logo-img {
          height: 48px;
          width: auto;
        }

        .page {
          max-width: 1200px;
          margin: 0 auto;
          padding: 16px;
        }

        .card {
          background: var(--card-bg);
          border: 1px solid var(--border);
          border-radius: 4px;
          padding: 16px 18px 20px;
          margin-top: 20px;
        }

        .card-header {
          font-size: 22px;
          font-weight: 600;
          margin-bottom: 12px;
        }

        .summary-line {
          display: flex;
          justify-content: space-between;
          padding: 8px 0;
          border-bottom: 1px solid var(--border);
          font-size: 16px;
        }

        .summary-line:last-child {
          border-bottom: none;
        }

        .summary-amount {
          font-family: "Courier New", monospace;
          font-weight: 600;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="top-bar">
    <div class="top-bar-inner">
        <div class="logo">
            <img th:src="@{/images/img.png}" src="/images/img.png" alt="Logo" class="logo-img">
        </div>
    </div>
</div>

<div class="checkout-header">
    <a href="/" class="checkout-home">Home</a>
    <span class="checkout-title">Sales Report</span>
</div>

<!-- PAGE CONTENT -->
<div class="page">

    <div class="card">
        <div class="card-header">Sales Summary</div>

        <!-- Sales loop -->
        <div th:each="sale : ${sales}" class="summary-line">
            <span th:text="${sale.itemName}">Item Name</span>
            <span class="summary-amount" th:text="${sale.total}">$0.00</span>
        </div>

        <!-- Optional total revenue -->
        <div class="summary-line" style="font-size: 18px; font-weight: 700; border-top: 2px solid var(--border); margin-top: 12px; padding-top: 12px;">
            <span>Total Revenue:</span>
            <span class="summary-amount" th:text="${totalRevenue}">$0.00</span>
        </div>
    </div>

</div>

</body>
</html>

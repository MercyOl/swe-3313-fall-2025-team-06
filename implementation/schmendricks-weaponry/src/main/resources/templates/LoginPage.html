<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schmendrick's Weaponry</title>
  <style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(180deg, #0e1a55, #4d2fa5);
        color: white;
        overflow: hidden;
    }




    .container {
        text-align: center;
    }




    h1 {
        margin: 0;
        font-size: 4rem;
        font-weight: 700;
    }




    h2 {
        margin: 0;
        font-size: 2rem;
        font-weight: 400;
        margin-bottom: -10px;
        position: relative;
        left: 40px; /* shift left */
        top: 5px; /* shift downward to overlap */
    }




    .button {
        display: block;
        width: 250px;
        padding: 15px 0;
        margin: 15px auto;
        font-size: 1.5rem;
        border-radius: 10px;
        border: 2px solid #001242;
        cursor: pointer;
        text-decoration: none;
    }




    .register-btn {
        background: #ffffff;
        color: #001242;
    }




    .login-btn {
        background: #0B1D51;
        color: white;
    }




    /* Floating sparkles */
    .sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        background-color: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: float 6s infinite ease-in-out;
        opacity: 0.7;
    }




    @keyframes float {
        0% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(180deg); }
        100% { transform: translateY(0) rotate(360deg); }
    }
  </style>
</head>
<body>




<script>
  // Generate sparkles
  for (let i = 0; i < 40; i++) {
      let s = document.createElement('div');
      s.classList.add('sparkle');
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.animationDelay = Math.random() * 6 + 's';
      s.style.transform = `scale(${Math.random() * 1.5})`;
      document.body.appendChild(s);
  }
</script>




<div class="container">
  <h2>Schmendrick's</h2>
  <h1>Weaponry</h1>


  <button class="button register-btn" onclick="showModal('registerModal')">Register</button>
  <button class="button login-btn" onclick="showModal('loginModal')">Login</button>
</div>
</body>


<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 0;
  }


  /* Modal overlay (background that covers whole page) */
  .modal-overlay {
    display: none; /* hidden by default */
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.6);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    animation: fadeIn 0.2s ease-out;
  }


  /* Modal container / content box */
  .modal-content {
    background: #ffffff;
    border-radius: 8px;
    padding: 24px 32px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    position: relative;
    animation: scaleIn 0.2s ease-out;
  }


  .modal-content h2 {
    margin-top: 0;
    margin-bottom: 16px;
    margin-left: -80px;
    font-weight: bold;
    font-size: 40px;
    text-align: center;
    color: #0B1D51;
  }


  .modal-content input[type="text"],
  .modal-content input[type="password"] {
    width: 100%;
    padding: 10px 14px;
    margin: 8px 0 16px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 14px;
  }


  .modal-content button {
    width: 100%;
    padding: 12px;
    background-color: #0B1D51;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
  .modal-content button:hover {
    background-color: #0053ba;
  }


  .modal-close-button {
    all: unset;           /* resets almost all inherited styles */
    position: absolute;
    top: 12px;
    right: 16px;
    width: 24px !important;
    height: 24px !important;
    background: none !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    color: #0B1D51 !important;
    font-size: 24px;
    line-height: 1;
    text-align: center;
    cursor: pointer;
 }
  .modal-close-button:hover {
    color: #000;
  }


  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes scaleIn {
    from { transform: scale(0.9); }
    to   { transform: scale(1); }
  }


  /* Responsive tweaks */
  @media (max-width: 480px) {
    .modal-content {
      padding: 20px;
      width: 95%;
    }
    .modal-content h2 {
      font-size: 20px;
    }
  }

  .error-bar {
    display: none; /* hidden by default */
    background-color: #ffdddd;
    border-left: 5px solid #ff4444;
    color: #000;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 4px;
}

  .success-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    color: #000;
    background-color: #ddffdd;
    border-top: 3px solid #33cc33;
    padding: 10px;
    text-align: center;
    font-weight: bold;
    z-index: 1000;
}

</style>


<body>

<!-- Login Modal -->
<div id="loginModal" class="modal-overlay">
  <div class="modal-content">
    <button class="modal-close-button" onclick="closeModal('loginModal')">&times;</button>
    <h2>Login</h2>
    <form th:action="@{/login}" method="post">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div th:if="${loginError}" id="loginErrorModal" class="error-bar">
      <p th:text="${loginError}"></p>
    </div>
  </div>
  </div>
</div>


<!-- Register Modal -->
<div id="registerModal" class="modal-overlay">
  <div class="modal-content">
    <button class="modal-close-button" onclick="closeModal('registerModal')">&times;</button>
    <h2>Register</h2>
    <form th:action="@{/register}" method="post">
      <input type="text" name="username" placeholder="Username" required>
      <input type="text" name="email" placeholder="Email" required>
      <input type="text" name="password" placeholder="Password" required>
      <button type="submit">Register</button>
    </form>

    <!-- Error message inside the modal -->
    <div th:if="${registerError}" id="registerErrorModal" class="error-bar">
      <p th:text="${registerError}"></p>
    </div>
  </div>
</div>

<div id="successBar" class="success-bar" style="display: none;">
  <p th:text="${registerSuccess}"></p>
</div>

<script>
  function showModal(id) {
    document.getElementById(id).style.display = 'flex';
  }
  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

</script>

<script th:if="${registerError}">
  showModal('registerModal'); // opens the modal if there's an error
  document.getElementById('registerErrorModal').style.display = 'block'; //shows the error
</script>

<script th:if="${registerSuccess}">
  document.getElementById('successBar').style.display = 'block';
</script>

<script th:if="${loginError}">
  showModal('loginModal'); // opens the modal if there's an error
  document.getElementById('loginErrorModal').style.display = 'block'; //shows the error
</script>

</body>


</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Montserrat", sans-serif; margin: 0; background: #f2f6fb; color: #1f2640; }
        .checkout-header { background: #6b4ca5; color: #fff; padding: 18px; display: flex; align-items: center; gap: 24px; }
        .checkout-home { color: #fff; text-decoration: none; font-size: 18px; opacity: 0.9; }
        .checkout-home:hover { opacity: 1; text-decoration: underline; }
        .checkout-title { flex: 1; text-align: center; font-size: 32px; font-weight: 600; }
        .page { max-width: 1200px; margin: 0 auto; padding: 16px; }
        .checkout-layout { display: grid; grid-template-columns: 2fr 1.7fr; gap: 18px; }
        .card { background: #fff; border: 1px solid #d4d8e0; border-radius: 4px; padding: 16px; }
        .summary-line { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; }
        .summary-line.total { margin-top: 8px; font-weight: 700; font-size: 18px; border-top: 1px solid #d4d8e0; padding-top: 8px; }
        .cart-items { margin-top: 18px; border-top: 1px solid #d4d8e0; padding-top: 16px; }
        .cart-item { display: grid; grid-template-columns: 80px minmax(0,1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid #d4d8e0; position: relative; }
        .cart-thumb { width: 80px; height: 80px; border-radius: 3px; background: #e2e6f0; }
        .remove-btn { cursor: pointer; color: #cc1e1e; font-weight: 600; margin-top: 6px; display: inline-block; }
        .checkout-button-wrapper { margin-top: 24px; text-align: center; }
        .checkout-btn { background: #4aa9ff; color: white; border: none; padding: 16px 28px; font-size: 20px; font-weight: 700; border-radius: 8px; cursor: pointer; width: 85%; transition: 0.2s ease; }
        .checkout-btn:hover { background: #238be6; }
    </style>
</head>
<body>

<div class="checkout-header">
    <a href="/" class="checkout-home">Home</a>
    <span class="checkout-title">Checkout</span>
</div>

<div class="page">
    <div class="checkout-layout">
        <!-- LEFT: Customer Info -->
        <div class="card">
            <div class="card-header">
                <span>Secure Checkout</span>
            </div>

            <form class="form-grid">
                <div class="form-group">
                    <label>First Name<span class="required">*</span></label>
                    <input type="text" placeholder="First Name"/>
                </div>
                <div class="form-group">
                    <label>Last Name<span class="required">*</span></label>
                    <input type="text" placeholder="Last Name"/>
                </div>
                <div class="form-group">
                    <label>Email<span class="required">*</span></label>
                    <input type="email" placeholder="Email"/>
                </div>
                <div class="form-group">
                    <label>Phone<span class="required">*</span></label>
                    <input type="tel" placeholder="Phone Number"/>
                </div>
                <div class="form-group full-width">
                    <label>Address<span class="required">*</span></label>
                    <input type="text" placeholder="e.g. 789 Street St"/>
                </div>
                <div class="form-group">
                    <label>City<span class="required">*</span></label>
                    <input type="text" placeholder="e.g. Buford"/>
                </div>
                <div class="form-group">
                    <label>State<span class="required">*</span></label>
                    <input type="text" placeholder="e.g. Georgia"/>
                </div>
                <div class="form-group">
                    <label>ZIP Code<span class="required">*</span></label>
                    <input type="text" placeholder="e.g. 30043"/>
                </div>

                <!-- Shipping Method -->
                <div class="form-group full-width">
                    <label for="shipping">Shipping Method:</label>
                    <select name="shipping" id="shipping">
                        <option value="GROUND">Ground – Free</option>
                        <option value="THREE_DAY">3-Day – $19</option>
                        <option value="OVERNIGHT">Overnight – $29</option>
                    </select>
                </div>
            </form>
        </div>

        <!-- RIGHT: Cart Summary -->
        <div class="card">
            <div class="card-top-row">
                <h2>In your Cart</h2>
                <a href="#">Edit</a>
            </div>

            <div class="summary-line">
                <span>Subtotal:</span>
                <span class="summary-amount" id="subtotal">$0.00</span>
            </div>
            <div class="summary-line">
                <span>Estimated Shipping:</span>
                <span class="summary-amount" id="shippingCost">$0.00</span>
            </div>
            <div class="summary-line">
                <span>Estimated Tax:</span>
                <span class="summary-amount" id="tax">$0.00</span>
            </div>
            <div class="summary-line total">
                <span>Total</span>
                <span class="summary-amount" id="total">$0.00</span>
            </div>

            <div class="cart-items" id="cartItems">
                <!-- Example cart items, each must have a unique data-id and price -->
                <div class="cart-item" data-id="1" data-price="49.99">
                    <div class="cart-thumb"></div>
                    <div>
                        <div class="cart-info-title">Steel Longsword</div>
                        <div class="cart-info-detail">A finely crafted longsword with perfect balance.</div>
                        <div class="cart-info-price">Price: $49.99</div>
                        <div class="remove-btn">Remove</div>
                    </div>
                </div>
                <div class="cart-item" data-id="2" data-price="29.99">
                    <div class="cart-thumb"></div>
                    <div>
                        <div class="cart-info-title">Iron Shield</div>
                        <div class="cart-info-detail">Sturdy shield for defense.</div>
                        <div class="cart-info-price">Price: $29.99</div>
                        <div class="remove-btn">Remove</div>
                    </div>
                </div>
            </div>

            <!-- Payment form -->
            <div class="checkout-button-wrapper">
                <form th:action="@{/payment}" method="post" id="paymentForm">
                    <input type="hidden" name="shipping" id="shippingInput" value="GROUND">
                    <div id="cartInputs"></div>
                    <button type="submit" class="checkout-btn">Continue to Payment</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const shippingCosts = { "GROUND": 0, "THREE_DAY": 19, "OVERNIGHT": 29 };
    const taxRate = 0.06;

    const shippingSelect = document.getElementById('shipping');
    const shippingInput = document.getElementById('shippingInput');
    const subtotalEl = document.getElementById('subtotal');
    const shippingEl = document.getElementById('shippingCost');
    const taxEl = document.getElementById('tax');
    const totalEl = document.getElementById('total');
    const cartItemsEl = document.getElementById('cartItems');
    const cartInputsEl = document.getElementById('cartInputs');

    function formatCurrency(amount) { return '$' + amount.toFixed(2); }

    function calculateSubtotal() {
        let subtotal = 0;
        cartItemsEl.querySelectorAll('.cart-item').forEach(item => {
            subtotal += parseFloat(item.getAttribute('data-price')) || 0;
        });
        return subtotal;
    }

    function updateTotals() {
        let subtotal = calculateSubtotal();
        let shipping = shippingCosts[shippingSelect.value];
        let tax = subtotal * taxRate;
        let total = subtotal + shipping + tax;

        subtotalEl.textContent = formatCurrency(subtotal);
        shippingEl.textContent = formatCurrency(shipping);
        taxEl.textContent = formatCurrency(tax);
        totalEl.textContent = formatCurrency(total);

        // Update hidden shipping input
        shippingInput.value = shippingSelect.value;
    }

    function updateCartInputs() {
        cartInputsEl.innerHTML = '';
        cartItemsEl.querySelectorAll('.cart-item').forEach((item, index) => {
            const itemId = item.getAttribute('data-id');
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = `cartItems[${index}].id`;
            input.value = itemId;
            cartInputsEl.appendChild(input);
        });
    }

    // Remove item
    cartItemsEl.addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-btn')) {
            const item = e.target.closest('.cart-item');
            if (item) item.remove();
            updateTotals();
            updateCartInputs();
        }
    });

    // Shipping change
    shippingSelect.addEventListener('change', () => {
        updateTotals();
    });

    document.addEventListener('DOMContentLoaded', () => {
        updateTotals();
        updateCartInputs();
    });
</script>

</body>
</html>

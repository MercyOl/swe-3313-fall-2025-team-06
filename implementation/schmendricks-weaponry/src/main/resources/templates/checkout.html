<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<script>
    //HTML CREATED WITH CHATGPT (SLIGHTLY MODIFIED)
</script>

<head>
    <meta charset="UTF-8"/>
    <title>Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* BASE STYLES */
        body { font-family: "Montserrat", sans-serif; margin: 0; background: #f2f6fb; color: #1f2640; }
        .checkout-header { background: #6b4ca5; color: #fff; padding: 18px; display: flex; align-items: center; gap: 24px; }
        .checkout-home { color: #fff; text-decoration: none; font-size: 18px; opacity: 0.9; }
        .checkout-home:hover { opacity: 1; text-decoration: underline; }
        .checkout-title { flex: 1; text-align: center; font-size: 32px; font-weight: 600; }
        .page { max-width: 1200px; margin: 0 auto; padding: 16px; }
        .checkout-layout { display: grid; grid-template-columns: 2fr 1.7fr; gap: 18px; }
        .card { background: #fff; border: 1px solid #d4d8e0; border-radius: 4px; padding: 16px; }
        .summary-line { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; }
        .summary-line.total { margin-top: 8px; font-weight: 700; font-size: 18px; border-top: 1px solid #d4d8e0; padding-top: 8px; }
        .cart-items { margin-top: 18px; border-top: 1px solid #d4d8e0; padding-top: 16px; }
        .cart-item { display: grid; grid-template-columns: 80px minmax(0,1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid #d4d8e0; }
        .cart-thumb { width: 80px; height: 80px; border-radius: 3px; background: #e2e6f0; }
        .remove-btn { cursor: pointer; color: #cc1e1e; font-weight: 600; margin-top: 6px; display: inline-block; }
        .checkout-button-wrapper { margin-top: 24px; text-align: center; }
        .checkout-btn { background: #4aa9ff; color: white; border: none; padding: 16px 28px; font-size: 20px; font-weight: 700; border-radius: 8px; cursor: pointer; width: 85%; transition: 0.2s ease; }
        .checkout-btn:hover { background: #238be6; }

        /* --- NEW FORM STYLES --- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 16px;
        }
        .form-group { display: flex; flex-direction: column; font-size: 13px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { margin-bottom: 4px; font-weight: 500; }

        /* Input/Select Styling */
        .form-group input, .form-group select {
            padding: 10px 12px;
            border: 1px solid #d4d8e0;
            border-radius: 4px;
            font-size: 15px;
            color: #1f2640;
            background: #fff;
            transition: border-color 0.2s ease;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #6b4ca5; /* Highlight border on focus */
            box-shadow: 0 0 0 1px #6b4ca5;
        }

        /* Optional style for visual consistency */
        .required { color: #1f2640; font-weight: 700; margin-left: 2px; }
        .form-group select { width: 100%; }
    </style>
</head>
<body>

<div class="checkout-header">
    <a href="/inventory" class="checkout-home">Home</a>
    <span class="checkout-title">Checkout</span>
</div>

<div class="page">
    <div class="checkout-layout">

        <div class="card">
            <div class="card-header">
                <span>Secure Checkout</span>
            </div>
            <form class="form-grid">
                <div class="form-group">
                    <label>First Name<span class="required">*</span></label>
                    <input type="text" placeholder="First Name" name="firstName"/>
                </div>
                <div class="form-group">
                    <label>Last Name<span class="required">*</span></label>
                    <input type="text" placeholder="Last Name" name="lastName"/>
                </div>
                <div class="form-group">
                    <label>Email<span class="required">*</span></label>
                    <input type="email" placeholder="Email" name="email"/>
                </div>
                <div class="form-group">
                    <label>Phone<span class="required">*</span></label>
                    <input type="tel" placeholder="Phone Number" name="phone"/>
                </div>
                <div class="form-group full-width">
                    <label>Address<span class="required">*</span></label>
                    <input type="text" placeholder="Street Address" name="address"/>
                </div>
                <div class="form-group">
                    <label>City<span class="required">*</span></label>
                    <input type="text" placeholder="City" name="city"/>
                </div>
                <div class="form-group">
                    <label>State<span class="required">*</span></label>
                    <input type="text" placeholder="State" name="state"/>
                </div>
                <div class="form-group">
                    <label>ZIP Code<span class="required">*</span></label>
                    <input type="text" placeholder="ZIP" name="zip"/>
                </div>

                <div class="form-group full-width">
                    <label for="shipping">Shipping Method:</label>
                    <select name="shipping" id="shipping" onchange="this.form.submit()">
                        <option th:value="GROUND" th:selected="${selectedShipping == T(com.team_06.schmendricks_weaponry.model.ShippingOption).GROUND}">Ground – Free</option>
                        <option th:value="THREE_DAY" th:selected="${selectedShipping == T(com.team_06.schmendricks_weaponry.model.ShippingOption).THREE_DAY}">3-Day – $19</option>
                        <option th:value="OVERNIGHT" th:selected="${selectedShipping == T(com.team_06.schmendricks_weaponry.model.ShippingOption).OVERNIGHT}">Overnight – $29</option>
                    </select>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>In your Cart</h2>

            <div class="cart-items">
                <div th:each="item, iterStat : ${cart?.cartItems}" class="cart-item" th:attr="data-id=${item.id},data-price=${item.price}">
                    <div class="cart-thumb"></div>
                    <div>
                        <div class="cart-info-title" th:text="${item.name}">Item Name</div>
                        <div class="cart-info-detail" th:text="${item.description}">Item description</div>
                        <div class="cart-info-price">
                            Price:
                            <span th:if="${item?.price != null}"
                                  th:text="|$| + ${#numbers.formatDecimal(item.price.doubleValue(), 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                            <span th:unless="${item?.price != null}">Price Missing</span>
                        </div>

                        <form th:action="@{/checkout/remove}" method="post" style="display:inline;">
                            <input type="hidden" th:name="itemId" th:value="${item.id}"/>
                            <button type="submit" class="remove-btn">Remove</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="summary-line">
                <span>Subtotal:</span>
                <span th:if="${cart?.subtotal != null}"
                      th:text="|$| + ${#numbers.formatDecimal(cart.subtotal.doubleValue(),1,'COMMA',2,'POINT')}">$0.00</span>
                <span th:unless="${cart?.subtotal != null}">$0.00</span>
            </div>

            <div class="summary-line">
                <span>Estimated Shipping:</span>
                <span th:if="${selectedShipping?.cost != null}"
                      th:text="|$| + ${#numbers.formatDecimal(selectedShipping.cost.doubleValue(),1,'COMMA',2,'POINT')}">$0.00</span>
                <span th:unless="${selectedShipping?.cost != null}">$0.00</span>
            </div>

            <div class="summary-line">
                <span>Estimated Tax:</span>
                <span th:if="${cart?.estimatedTax != null}"
                      th:text="|$| + ${#numbers.formatDecimal(cart.estimatedTax.doubleValue(),1,'COMMA',2,'POINT')}">$0.00</span>
                <span th:unless="${cart?.estimatedTax != null}">$0.00</span>
            </div>

            <div class="summary-line total">
                <span>Total:</span>
                <span th:if="${cart?.total != null and selectedShipping?.cost != null}"
                      th:text="|$| + ${#numbers.formatDecimal(cart.total.add(selectedShipping.cost).doubleValue(),1,'COMMA',2,'POINT')}">$0.00</span>
                <span th:unless="${cart?.total != null and selectedShipping?.cost != null}">$0.00</span>
            </div>

            <div class="checkout-button-wrapper">
                <form th:action="@{/payment}" method="post">
                    <input type="hidden" th:name="shipping" th:value="${selectedShipping}"/>
                    <button type="submit" class="checkout-btn">Continue to Payment</button>
                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>

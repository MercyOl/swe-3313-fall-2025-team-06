<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #6b4ca5;
      --blue-light: #8fd2f3;
      --border: #d4d8e0;
      --text-main: #1f2640;
      --text-muted: #6b7385;
      --bg-page: #f2f6fb;
      --card-bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Montserrat", system-ui, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
    }
    a { color: inherit; text-decoration: none; }

    .top-bar { background: #0d1b46; padding: 10px 0; }
    .top-bar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
    }
    .logo { font-weight: 600; font-size: 20px; }

    .cart-link {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 500;
    }

    .checkout-header {
      background: var(--purple);
      color: #ffffff;
      padding: 18px 0;
      text-align: center;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }
    .back-link {
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 500;
    }

    .checkout-layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.7fr);
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px 18px 20px;
    }
    .card-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 600;
    }

    .delivery-toggle {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .delivery-toggle button {
      border: none;
      padding: 10px 0;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #ffffff;
    }
    .delivery-toggle button.active {
      background: var(--blue-light);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }
    .form-group.full-width { grid-column: 1 / -1; }

    .form-group label { margin-bottom: 4px; font-weight: 500; }
    .form-group label span.required { color: #cc1e1e; }

    .form-group input {
      padding: 8px 10px;
      border-radius: 3px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus { border-color: var(--purple); }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .card-top-row h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .card-top-row a {
      font-size: 13px;
      text-decoration: underline;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .summary-line.total {
      margin-top: 8px;
      font-weight: 700;
      font-size: 18px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .summary-amount { font-family: "Courier New", monospace; }

    .cart-items {
      margin-top: 18px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr);
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-thumb {
      width: 80px;
      height: 80px;
      border-radius: 3px;
      background: #e2e6f0;
    }
    .cart-info-title { font-weight: 600; margin-bottom: 4px; }
    .cart-info-detail { font-size: 13px; color: var(--text-muted); margin-bottom: 2px; }
    .cart-info-price { font-size: 14px; font-weight: 500; margin-top: 4px; }

    @media (max-width: 900px) {
      .checkout-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .card { padding: 14px; }
      .form-grid { grid-template-columns: 1fr; }
    }

    .checkout-button-wrapper {
       margin-top: 24px;
       text-align: center;
}

     .checkout-btn {
       background: #4aa9ff;
        color: white;
        border: none;
        padding: 16px 28px;
        font-size: 20px;
        font-weight: 700;
        border-radius: 8px;
        cursor: pointer;
        width: 85%;
        transition: 0.2s ease;
}

      .checkout-btn:hover {
        background: #238be6;
}

      .checkout-btn:active {
        transform: scale(0.96);
}
      .logo {
        display: flex;
        align-items: center;
}

      .logo-img {
        height: 48px;   /* Adjust this to fit your header cleanly */
        width: auto;
        display: block;
}

      .sub-nav {
        background: #7b59b4;
        padding: 10px 20px;
        display: flex;
        gap: 25px;
        align-items: center;
}
      .checkout-header {
        background: var(--purple);
        color: #ffffff;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 24px;
}

      .checkout-home {
        font-size: 18px;
        font-weight: 500;
        text-decoration: none;
        color: #ffffff;
        opacity: 0.9;
        transition: 0.2s ease;
}

      .checkout-home:hover {
        opacity: 1;
        text-decoration: underline;
}

      .checkout-title {
        flex: 1;
        text-align: center;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 0.04em;
}



  </style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-inner">
    <div class="logo">
      <img
        th:src="@{/images/Logo.png}"
        src="/images/Logo.png"
        alt="Schmendrick's Weaponry"
        class="logo-img">
    </div>
  </div>
</div>


<div class="checkout-header">
  <a href="/" class="checkout-home">Home</a>
  <span class="checkout-title">Checkout</span>
</div>

<div class="page">

  <div class="checkout-layout">
    <!-- LEFT -->
    <div class="card">
      <div class="card-header">
        <span>1.</span>
        <span>Delivery Options</span>
      </div>

      <div class="delivery-toggle">
        <button class="active" type="button">Pick Up</button>
        <button type="button">Ship</button>
      </div>

      <form class="form-grid">
        <div class="form-group">
          <label>First Name<span class="required">*</span></label>
          <input type="text" placeholder="First Name"/>
        </div>
        <div class="form-group">
          <label>Last Name<span class="required">*</span></label>
          <input type="text" placeholder="Last Name"/>
        </div>
        <div class="form-group">
          <label>Email<span class="required">*</span></label>
          <input type="email" placeholder="Email"/>
        </div>
        <div class="form-group">
          <label>Phone<span class="required">*</span></label>
          <input type="tel" placeholder="Phone Number"/>
        </div>
        <div class="form-group full-width">
          <label>Delivery Address<span class="required">*</span></label>
          <input type="text" placeholder="e.g. Unit 1, 789 Street St"/>
        </div>
      </form>
    </div>

    <!-- RIGHT -->
    <div class="card">
      <div class="card-top-row">
        <h2>In your Cart</h2>
        <a href="#">Edit</a>
      </div>

      <div class="summary-line">
        <span>Subtotal:</span>
        <span class="summary-amount"
              th:text="${#numbers.formatDecimal(cart.subtotal, 1, 'COMMA', 2, 'POINT')}">
          $000.00
        </span>
      </div>
      <div class="summary-line">
        <span>Estimated Shipping:</span>
        <span class="summary-amount"
              th:text="${#numbers.formatDecimal(cart.estimatedShipping, 1, 'COMMA', 2, 'POINT')}">
          $000.00
        </span>
      </div>
      <div class="summary-line">
        <span>Estimated Tax:</span>
        <span class="summary-amount"
              th:text="${#numbers.formatDecimal(cart.estimatedTax, 1, 'COMMA', 2, 'POINT')}">
          $000.00
        </span>
      </div>

      <div class="summary-line total">
        <span>Total</span>
        <span class="summary-amount"
              th:text="${#numbers.formatDecimal(cart.total, 1, 'COMMA', 2, 'POINT')}">
          $000.00
        </span>
      </div>

      <div class="cart-items">
        <div th:each="item : ${cart.items}" class="cart-item">
          <div class="cart-thumb"></div>
          <div>
            <div class="cart-info-title" th:text="${item.title}">Lorem ipsum dolor sit</div>
            <div class="cart-info-detail" th:text="${item.deliveryText}">
              Delivered WeekDay, Month Day
            </div>
            <div class="cart-info-price">
              Price:
              <span th:text="${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}">
                $000.00
              </span>
            </div>
          </div>
        </div>
      </div>
      <!-- CHECKOUT BUTTON -->
      <div class="checkout-button-wrapper">
        <button type="submit" class="checkout-btn">
          Checkout
        </button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
